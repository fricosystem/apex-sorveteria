kind = "web"
previewPath = "/"
title = "APEX Sorveteria"
version = "1.0.0"
id = "artifacts/apex-sorveteria"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22491

[services.development]
run = "pnpm --filter @workspace/apex-sorveteria run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apex-sorveteria", "run", "build" ]
publicDir = "artifacts/apex-sorveteria/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22491"
BASE_PATH = "/"
