kind = "mobile"
previewPath = "/mobile/"
title = "APEX Sorveteria Mobile"
version = "1.0.0"
id = "artifacts/apex-sorveteria-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 21857

[services.development]
run = "pnpm --filter @workspace/apex-sorveteria-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apex-sorveteria-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/apex-sorveteria-mobile", "run", "serve" ]

[services.env]
PORT = "21857"
BASE_PATH = "/mobile/"
